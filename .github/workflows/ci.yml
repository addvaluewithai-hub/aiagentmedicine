name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        id: lint
        shell: bash
        run: |
          set +e
          npx expo lint -- --format json --output-file eslint-report.json
          status=$?
          if [ -f eslint-report.json ]; then
            node -e "const fs=require('fs'); const report=JSON.parse(fs.readFileSync('eslint-report.json','utf8')); for (const file of report) for (const m of file.messages) console.log(`${file.filePath}:${m.line}:${m.column} ${m.severity===2?'error':'warning'} ${m.ruleId ?? ''} ${m.message}`);"
          fi
          exit $status

      - name: Upload ESLint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: eslint-report.json
          if-no-files-found: ignore

      - name: Expo doctor
        run: npm run doctor

      - name: Export web and API routes
        run: npx expo export --platform web --no-ssg
